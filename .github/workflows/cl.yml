name: Android Multi-Module Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [core, hud, radar]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: 27.2
          cmake-version: 3.22.1

      - run: chmod +x ./gradlew

      - run: ./gradlew assembleRelease -Pmodule=${{ matrix.module }} -Pabi=arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.module }}-arm64-v8a
          path: app/build/outputs/apk/release/*.apk

  notify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "All modules built successfully"
